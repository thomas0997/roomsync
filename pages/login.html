<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomSync | Log in</title>
  <link rel="icon" href="../assets/roomsync_logo.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="../css/styles_login.css" rel="stylesheet">
</head>

<body>

  <div class="login-wrap">
    <a href="index.html" class="logo-head" aria-label="RoomSync home">
      <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="logo-mark">
      <div class="logo-word"><span class="room">room</span><span class="sync">sync</span></div>
    </a>

    <div class="card">
      <h1 class="card-title">Log in</h1>
      <p class="card-sub">Welcome back. Pick up where your room left off.</p>

      <div id="login-error" class="login-error" role="alert" hidden>Incorrect email or password.</div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="email">EMAIL</label>
          <input type="text" id="email" name="email" placeholder="you@school.edu" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" maxlength="128">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button class="btn-login" id="loginBtn" type="submit">Log in</button>
      </form>

      <div class="divider">
        <div class="line"></div>
        <div class="label">QUICK LOG IN</div>
        <div class="line"></div>
      </div>

      <div class="quick-row">
        <button class="btn-quick" id="quickAdmin" type="button">Continue as Admin</button>
        <button class="btn-quick" id="quickMember" type="button">Continue as Member</button>
      </div>
    </div>

    <a href="index.html" class="back-link">&larr; Back to home</a>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
