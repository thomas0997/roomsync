<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomSync | Log in</title>
  <link rel="icon" href="../assets/roomsync_logo.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="../css/styles_login.css" rel="stylesheet">
</head>

<body>

  <div class="login-wrap">
    <a href="index.html" class="logo-head" aria-label="RoomSync home">
      <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="logo-mark">
      <div class="logo-word"><span class="room">room</span><span class="sync">sync</span></div>
    </a>

    <div class="card">
      <div class="auth-tabs" role="tablist" aria-label="Log in or sign up">
        <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true" aria-controls="authForm">Log in</button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="authForm">Sign up</button>
      </div>

      <p class="card-sub" id="cardSub">Welcome back. Pick up where your room left off.</p>

      <div id="auth-error" class="login-error" role="alert" hidden></div>

      <form id="authForm" class="auth-form" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="name">NAME</label>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" maxlength="100">
        </div>

        <div class="field">
          <label for="email">EMAIL</label>
          <input type="email" id="email" name="email" placeholder="you@school.edu" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" maxlength="128">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="hint" id="pwHint" hidden>At least 8 characters.</p>
        </div>

        <button class="btn-login" id="submitBtn" type="submit">Log in</button>
      </form>

      <p class="switch-row" id="switchRow">New to RoomSync? <button type="button" class="link-btn" id="switchBtn">Create an account</button></p>
    </div>

    <a href="index.html" class="back-link">&larr; Back to home</a>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
