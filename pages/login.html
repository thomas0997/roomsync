<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomSync — Log in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="../css/styles_login.css" rel="stylesheet">
</head>

<body>

  <div class="login-wrap">
    <div class="logo-head">
      <div class="logo-mark"><span class="slash">\</span>R</div>
      <div class="logo-word"><span class="room">room</span><span class="sync">sync</span></div>
    </div>

    <div class="card">
      <div class="card-title">Log in</div>

      <div class="field">
        <label>EMAIL</label>
        <input type="email" placeholder="you@roomsync.ph">
      </div>

      <div class="field">
        <label>PASSWORD</label>
        <input type="password" placeholder="•••••••••••••">
      </div>

      <button class="btn-login">Log in</button>

      <div class="divider">
        <div class="line"></div>
        <div class="label">QUICK LOG IN</div>
        <div class="line"></div>
      </div>

      <button class="btn-oauth">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.63H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.37l4-3.09z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.63l4 3.09C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
        <span>Continue with Google</span>
      </button>

      <button class="btn-oauth">
        <svg viewBox="0 0 24 24" fill="#000"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.24-.02-.35-.03-.01-.1-.03-.226-.03-.35 0-1.11.545-2.24 1.19-2.98.741-.85 2.024-1.51 3.026-1.55.019.083.328.128.328.26zm4.276 15.72c-.09.22-.53 1.83-1.75 3.5-1.06 1.45-2.15 2.9-3.88 2.93-1.7.03-2.25-1-4.19-1-1.94 0-2.55.97-4.16 1.03-1.66.06-2.93-1.57-4-3.01-2.18-2.94-3.85-8.31-1.61-11.94 1.11-1.8 3.1-2.94 5.26-2.97 1.63-.03 3.17 1.1 4.17 1.1 1 0 2.86-1.36 4.82-1.16.82.03 3.13.33 4.61 2.5-.12.08-2.75 1.6-2.72 4.79.03 3.81 3.34 5.08 3.38 5.1-.03.09-.53 1.82-1.75 3.5v.03z"/></svg>
        <span>Continue with Apple</span>
      </button>

      <div class="quick-row">
        <button class="btn-quick">Continue as Admin</button>
        <button class="btn-quick">Continue as Member</button>
      </div>
    </div>
  </div>

</body>
</html>
