<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomSync | Verify your email</title>
  <link rel="icon" href="../assets/roomsync_logo.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="../css/styles_login.css" rel="stylesheet">
</head>

<body>

  <div class="login-wrap">
    <a href="index.html" class="logo-head" aria-label="RoomSync home">
      <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="logo-mark">
      <div class="logo-word"><span class="room">room</span><span class="sync">sync</span></div>
    </a>

    <div class="card">
      <h1 class="auth-title" id="verifyTitle">Verifying your email&hellip;</h1>
      <p class="card-sub" id="cardSub">Hold on a second.</p>

      <div id="auth-error" class="login-error" role="alert" hidden></div>
      <div id="auth-done" class="login-done" role="status" hidden></div>

      <p class="switch-row" id="switchRow"></p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/verify.js"></script>
</body>
</html>
