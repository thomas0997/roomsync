<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomSync — Log in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="../css/styles_login.css" rel="stylesheet">
</head>

<body>

  <div class="login-wrap">
    <div class="logo-head">
      <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="logo-mark">
      <div class="logo-word"><span class="room">room</span><span class="sync">sync</span></div>
    </div>

    <div class="card">
      <div class="card-title">Log in</div>

      <div id="login-error" class="login-error" hidden>Incorrect email or password.</div>

      <div class="field">
        <label for="email">EMAIL</label>
        <input type="text" id="email" placeholder="you@roomsync.ph">
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" placeholder="•••••••••••••">
      </div>

      <button class="btn-login" id="loginBtn" type="button">Log in</button>

      <div class="divider">
        <div class="line"></div>
        <div class="label">QUICK LOG IN</div>
        <div class="line"></div>
      </div>

      <button class="btn-oauth">
        <img src="../assets/GoogleLogo.png" alt="Google logo">
        <span>Continue with Google</span>
      </button>

      <button class="btn-oauth">
        <img src="../assets/AppleLogo.png" alt="Apple logo">
        <span>Continue with Apple</span>
      </button>

      <div class="quick-row">
        <button class="btn-quick" id="quickAdmin">Continue as Admin</button>
        <button class="btn-quick" id="quickMember">Continue as Member</button>
      </div>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
