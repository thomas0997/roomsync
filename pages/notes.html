<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoomSync — Notes</title>
<meta name="description" content="RoomSync notes — docs, sheets, and files, together in one room.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="rs-brand-logo">
      <span class="brand-word desktop-only-inline"><span class="dim">room</span>sync</span>
      <span class="brand-word mobile-only-inline"><span class="dim">room</span>sync</span>
    </div>

    <nav class="topbar-nav desktop-only">
      <a href="home.html">Home</a>
      <a href="calendar.html">Calendar</a>
      <a href="notes.html" class="active">Notes</a>
      <a href="discussion.html">Discussion</a>
      <a href="approve.html">Approve</a>
      <a href="about.html">About</a>
    </nav>

    <div class="topbar-actions">
      <div class="room-switcher tablet-only">
        <button class="room-pill-floating" id="roomPillBtnTablet" aria-haspopup="true" aria-expanded="false">
          <img src="../assets/TheBozos_Logo.jpg" alt="The Bozos" class="room-avatar" data-room-avatar>
          <span class="room-name" data-room-name>The Bozos</span>
        </button>
        <div class="room-dropdown" id="roomDropdownTablet" hidden>
          <button class="room-dropdown-item active" data-room="The Bozos" data-avatar-class="" data-avatar-src="../assets/TheBozos_Logo.jpg">
            <img src="../assets/TheBozos_Logo.jpg" alt="The Bozos" class="room-avatar"> The Bozos
          </button>
          <button class="room-dropdown-item" data-room="Auron Inc." data-avatar-class="room-avatar-outline" data-avatar-src="../assets/Auroninc_Logo.jpg">
            <img src="../assets/Auroninc_Logo.jpg" alt="Auron Inc." class="room-avatar"> Auron Inc.
          </button>
          <button class="room-dropdown-item" data-room="CYB201" data-avatar-class="room-avatar-outline" data-avatar-src="../assets/CYB201_Logo.jpg">
            <img src="../assets/CYB201_Logo.jpg" alt="CYB201" class="room-avatar"> CYB201
          </button>
        </div>
      </div>

      <button class="hamburger mobile-only" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo-row">
          <img src="../assets/roomsync_logo.png" alt="RoomSync logo" class="rs-brand-logo">
          <span class="brand-word brand-word-lg sidebar-wordmark"><span class="dim">room</span>sync</span>
        </div>

        <div class="room-buttons desktop-only" role="tablist" aria-label="Your rooms">
          <button class="room-pill room-pill-active">
            <img src="../assets/TheBozos_Logo.jpg" alt="The Bozos" class="room-avatar">
            <span class="room-name">The Bozos</span>
            <span class="room-dot"></span>
            <span class="room-count">13</span>
          </button>
          <button class="room-pill">
            <img src="../assets/Auroninc_Logo.jpg" alt="Auron Inc." class="room-avatar room-avatar-outline">
            <span class="room-name">Auron Inc.</span>
            <span class="room-dot"></span>
            <span class="room-count">4</span>
          </button>
          <button class="room-pill">
            <img src="../assets/CYB201_Logo.jpg" alt="CYB201" class="room-avatar room-avatar-outline">
            <span class="room-name">CYB201</span>
            <span class="room-dot"></span>
            <span class="room-count">9</span>
          </button>
        </div>

        <div class="sidebar-divider tablet-only-block"></div>

        <nav class="sidebar-nav tablet-mobile-nav">
          <a href="home.html" class="sidebar-link">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.7c-.42 0-.83.16-1.15.46L2.9 10.1c-.4.37-.42 1-.05 1.4.37.4 1 .42 1.4.05l.4-.37V19.5c0 1.24 1.01 2.25 2.25 2.25H9.5a.75.75 0 0 0 .75-.75v-4.5c0-.83.67-1.5 1.5-1.5h.5c.83 0 1.5.67 1.5 1.5V21c0 .41.34.75.75.75h2.5c1.24 0 2.25-1.01 2.25-2.25v-8.32l.4.37c.4.37 1.03.35 1.4-.05.37-.4.35-1.03-.05-1.4l-7.95-6.94a1.7 1.7 0 0 0-1.15-.46z"/>
              </svg>
            </span>
            <span class="sidebar-label">Home</span>
          </a>
          <a href="calendar.html" class="sidebar-link">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <rect x="3" y="4.5" width="18" height="16" rx="4"/>
                <rect x="7" y="2" width="2.2" height="4.5" rx="1.1"/>
                <rect x="14.8" y="2" width="2.2" height="4.5" rx="1.1"/>
                <rect x="3" y="9" width="18" height="1.6" fill="#f5f5f7"/>
              </svg>
            </span>
            <span class="sidebar-label">Calendar</span>
          </a>
          <a href="notes.html" class="sidebar-link active">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 2a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V9.24a3 3 0 0 0-.879-2.121l-4.24-4.24A3 3 0 0 0 11.76 2H8z"/>
                <path d="M12 2.5v4.74a2 2 0 0 0 2 2h4.74z" fill="#f5f5f7"/>
              </svg>
            </span>
            <span class="sidebar-label">Notes</span>
          </a>
          <a href="discussion.html" class="sidebar-link">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.68 1.4 5.07 3.6 6.68-.14.98-.55 2.24-1.42 3.4a.5.5 0 0 0 .5.78c2.02-.4 3.6-1.2 4.66-1.9.86.2 1.76.32 2.66.32 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/>
              </svg>
            </span>
            <span class="sidebar-label">Discussion</span>
          </a>
          <a href="approve.html" class="sidebar-link">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10" mask="url(#approve-mask)"/>
                <mask id="approve-mask">
                  <rect x="0" y="0" width="24" height="24" fill="white"/>
                  <path d="M7.5 12.5l2.8 2.8 6.2-6.6" stroke="black" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </mask>
              </svg>
            </span>
            <span class="sidebar-label">Approve</span>
          </a>
          <a href="about.html" class="sidebar-link mobile-only-inline-flex">
            <span class="sidebar-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10" mask="url(#about-mask)"/>
                <mask id="about-mask">
                  <rect x="0" y="0" width="24" height="24" fill="white"/>
                  <circle cx="12" cy="7.7" r="1.35" fill="black"/>
                  <rect x="10.8" y="10.5" width="2.4" height="7" rx="1.2" fill="black"/>
                </mask>
              </svg>
            </span>
            <span class="sidebar-label">About</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="profile-row">
          <a href="profile.html" class="profile-row-link" id="profileLink">
            <div class="avatar">
              <img src="../assets/profile_photo.png" alt="Tony Franks" class="avatar-img">
              <span class="status-dot"></span>
            </div>
            <div class="profile-text profile-text-conditional">
              <div class="profile-name">Tony Franks</div>
              <div class="profile-status">Working!</div>
            </div>
          </a>
          <button class="settings-icon profile-text-conditional" id="settingsBtn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="content">

      <div class="room-switcher mobile-only">
        <button class="room-pill-floating" id="roomPillBtnMobile" aria-haspopup="true" aria-expanded="false">
          <img src="../assets/TheBozos_Logo.jpg" alt="The Bozos" class="room-avatar" data-room-avatar>
          <span class="room-name" data-room-name>The Bozos</span>
        </button>
        <div class="room-dropdown" id="roomDropdownMobile" hidden>
          <button class="room-dropdown-item active" data-room="The Bozos" data-avatar-class="" data-avatar-src="../assets/TheBozos_Logo.jpg">
            <img src="../assets/TheBozos_Logo.jpg" alt="The Bozos" class="room-avatar">
            The Bozos
          </button>
          <button class="room-dropdown-item" data-room="Auron Inc." data-avatar-class="room-avatar-outline" data-avatar-src="../assets/Auroninc_Logo.jpg">
            <img src="../assets/Auroninc_Logo.jpg" alt="Auron Inc." class="room-avatar room-avatar-outline">
            Auron Inc.
          </button>
          <button class="room-dropdown-item" data-room="CYB201" data-avatar-class="room-avatar-outline" data-avatar-src="../assets/CYB201_Logo.jpg">
            <img src="../assets/CYB201_Logo.jpg" alt="CYB201" class="room-avatar room-avatar-outline">
            CYB201
          </button>
        </div>
      </div>

      <button class="btn-todo tablet-only" id="newTodoBtnTablet">
        <span class="plus">+</span> New TODO
      </button>

      <div class="page-header-row">
        <div class="page-header">
          <p class="page-eyebrow desktop-tablet-only">NOTES</p>
          <h1 class="page-title desktop-tablet-only">What's Being Shared in The Bozos</h1>
          <h1 class="page-title page-title-mobile mobile-only-inline">Notes</h1>
          <p class="page-subtitle">Docs, sheets, and files — together in one room.</p>
        </div>
        <button class="btn-todo desktop-only" id="newTodoBtnDesktop">
          <span class="plus">+</span> New TODO
        </button>
      </div>

      <!-- ---------- QUICK ACTIONS ---------- -->
      <div class="notes-quick-actions">
        <button class="notes-quick-card">
          <span class="notes-quick-icon notes-icon-doc">D</span>
          <span class="notes-quick-text">
            <span class="notes-quick-title">New Doc</span>
            <span class="notes-quick-sub">All your notes in one place!</span>
          </span>
        </button>
        <button class="notes-quick-card">
          <span class="notes-quick-icon notes-icon-sheet">S</span>
          <span class="notes-quick-text">
            <span class="notes-quick-title">New Sheet</span>
            <span class="notes-quick-sub">All your spreadsheets in one place!</span>
          </span>
        </button>
        <button class="notes-quick-card notes-upload-card">
          <span class="notes-quick-icon notes-icon-generic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="notes-quick-text">
            <span class="notes-quick-title">Upload File</span>
            <span class="notes-quick-sub">PDF, image, slides, and anything else</span>
          </span>
        </button>
      </div>

      <hr class="section-rule">

      <!-- ---------- FILTER PILLS ---------- -->
      <div class="notes-filter-row">
        <button class="notes-filter-pill notes-filter-active" data-filter="all">All</button>
        <button class="notes-filter-pill" data-filter="docs">Docs</button>
        <button class="notes-filter-pill" data-filter="sheets">Sheets</button>
        <button class="notes-filter-pill" data-filter="files">Files</button>
      </div>

      <!-- Grid/Scroll toggle — reuses the exact mechanism from Home/Calendar (rooms.js targets
           .layout-btn/.board generically), just made visible on mobile too for this page. -->
      <div class="board-controls notes-board-controls">
        <div class="layout-toggle">
          <button class="layout-btn layout-btn-active" data-view="grid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Grid
          </button>
          <button class="layout-btn" data-view="scroll">
            ↕ Scroll
          </button>
        </div>
      </div>

      <!-- ---------- FILE GRID ---------- -->
      <div class="notes-file-grid board">
        <button class="notes-file-card" data-type="docs">
          <span class="notes-file-icon notes-icon-doc">D</span>
          <span class="notes-file-name">6ICYBER Midterm Reviewer</span>
          <span class="notes-file-meta"><span class="notes-file-dot"></span>Bayani is editing</span>
        </button>
        <button class="notes-file-card" data-type="docs">
          <span class="notes-file-icon notes-icon-doc">D</span>
          <span class="notes-file-name">Midterm IWEB Reviewer</span>
          <span class="notes-file-meta">Thomas Franco • edited 3 hours ago</span>
        </button>
        <button class="notes-file-card" data-type="sheets">
          <span class="notes-file-icon notes-icon-sheet">S</span>
          <span class="notes-file-name">CYB201 Expenses</span>
          <span class="notes-file-meta">Daniel Rodriguez • edited 9 hours ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">PY</span>
          <span class="notes-file-name">Nodes.py</span>
          <span class="notes-file-meta">Sean Dayrit • edited 12 hours ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">PY</span>
          <span class="notes-file-name">LinkedList.py</span>
          <span class="notes-file-meta">Thomas Franco • edited a day ago</span>
        </button>
        <button class="notes-file-card" data-type="docs">
          <span class="notes-file-icon notes-icon-doc">D</span>
          <span class="notes-file-name">ETHICS Answer Sheet</span>
          <span class="notes-file-meta">Thomas Franco • edited 2 days ago</span>
        </button>
        <button class="notes-file-card" data-type="docs">
          <span class="notes-file-icon notes-icon-doc">D</span>
          <span class="notes-file-name">CONWORLD Arguments</span>
          <span class="notes-file-meta">Mary Rose Bayani • edited 2 days ago</span>
        </button>
        <button class="notes-file-card" data-type="sheets">
          <span class="notes-file-icon notes-icon-sheet">S</span>
          <span class="notes-file-name">Grades</span>
          <span class="notes-file-meta">Daniel Rodriguez • edited 3 days ago</span>
        </button>
        <button class="notes-file-card" data-type="docs">
          <span class="notes-file-icon notes-icon-doc">D</span>
          <span class="notes-file-name">Calculus Notes</span>
          <span class="notes-file-meta">Bayani • edited 3 days ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">PDF</span>
          <span class="notes-file-name">Reviewers.pdf</span>
          <span class="notes-file-meta">Auron • edited 4 days ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">JAVA</span>
          <span class="notes-file-name">main.java</span>
          <span class="notes-file-meta">Hans • edited 5 days ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">JAVA</span>
          <span class="notes-file-name">NameException.java</span>
          <span class="notes-file-meta">Hans • edited 5 days ago</span>
        </button>
        <button class="notes-file-card" data-type="files">
          <span class="notes-file-icon notes-icon-generic">JAVA</span>
          <span class="notes-file-name">Student.java</span>
          <span class="notes-file-meta">Hans • edited 5 days ago</span>
        </button>
      </div>

    </main>
  </div>

  <div class="mobile-fab-bar mobile-only">
    <button class="fab-pill">TODAY</button>
    <button class="fab-round" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
    </button>
    <button class="fab-round fab-round-primary" aria-label="New file" id="newTodoBtnMobile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
    </button>
  </div>

  <script src="../js/rooms.js"></script>
  <script src="../js/notes.js"></script>
</body>
</html>
